# BOFH Toolkit - Edit Guidelines
# --------------------------------
# PLEASE READ BEFORE MODIFYING THIS REPOSITORY
#
# DEVELOPMENT PRACTICES:
# 1. ALWAYS create a new branch before making changes:
#    git checkout -b feature/your-feature-name
#
# 2. Make small, atomic commits with clear messages:
#    git commit -m "fix: resolve ContainerConfig issue in vectorizer"
#
# 3. Follow these commit message prefixes:
#    - feat: (new feature)
#    - fix: (bug fix)
#    - docs: (documentation changes)
#    - style: (formatting, no code change)
#    - refactor: (code change that neither fixes a bug nor adds a feature)
#    - test: (adding or updating tests)
#    - chore: (maintenance tasks)
#
# 4. Create a pull request for code review before merging to main
#
# 5. IMPORTANT: Validate each step works BEFORE moving to the next task
#    - Work slowly and methodically
#    - Test all changes immediately
#    - Document any issues encountered
#
# NOTE: MCP (ModelContextProtocol) is the protocol used by this toolkit for operation.
# When using MCP-enabled tools, take extra care to follow these guidelines.

title: "ModelContextProtocol (MCP) for BOFH - MVP"

introduction: "This document outlines the basic commands for interacting with the BOFH toolkit through the ModelContextProtocol. The BOFH (Bastard Operator From Hell) toolkit provides utilities for system administration, file manipulation, and Docker operations."

required_tools:
  desktop_commander:
    - name: "read_file"
      description: "Read the contents of a file from the file system"
      usage: "Used to examine configuration files and data"
    - name: "write_file"
      description: "Write content to a file on the file system"
      usage: "Used to create or update configuration files and scripts"
    - name: "list_directory"
      description: "Get a listing of files and directories"
      usage: "Used to explore directory structures"
    - name: "create_directory"
      description: "Create a new directory"
      usage: "Used to set up directory structures for projects"
    - name: "execute_command"
      description: "Execute a single shell command with arguments"
      usage: "Used for simple command execution"
    - name: "execute_full_command"
      description: "Execute a complete shell command string"
      usage: "Used for complex commands with pipes, redirections, etc."
  file_system_tools:
    - name: "find"
      description: "Recursively search for files and directories"
      usage: "find /path/to/search -type f -not -path '*/\\.*' # Find all non-hidden files"
      example: "find bofh -type f -not -path '*/\\.*' # Find all non-hidden files in BOFH directory"
    - name: "grep"
      description: "Search for patterns in files"
      usage: "grep -r 'pattern' /path/to/search # Recursively search for pattern"
    - name: "ls"
      description: "List directory contents"
      usage: "ls -la /path/to/directory # List all files with details"
  docker_management:
    - name: "docker-compose"
      description: "Docker Compose for multi-container applications"
      usage: "Used to define and run multi-container Docker applications"
    - name: "dockerd"
      description: "Docker daemon"
      usage: "Core Docker service that manages containers"
    - name: "docker-desktop"
      description: "Docker Desktop application"
      usage: "GUI for managing Docker resources and settings"
  development_tools:
    - name: "git"
      description: "Git version control system"
      usage: "Used for source code management"
    - name: "python"
      description: "Python interpreter"
      usage: "Used for running Python scripts and applications"
    - name: "pip"
      description: "Python package installer"
      usage: "Used for installing Python dependencies"

file_paths:
  main_scripts:
    - path: "bofh/bin/bofh"
      description: "Main BOFH command line interface"
    - path: "bofh/config.sh"
      description: "Global configuration file"
    - path: "bofh/reset-docker.sh"
      description: "Script to reset Docker environment"
  tools:
    vectorizer:
      - path: "bofh/tools/vectorizer/analyze-directory.sh"
        description: "Main script to analyze directory structure"
      - path: "bofh/tools/vectorizer/docker-compose.yml"
        description: "Docker Compose configuration for vectorizer"
      - path: "bofh/tools/vectorizer/Dockerfile"
        description: "Docker image definition for vectorizer"
    find2tar:
      - path: "bofh/tools/find2tar/mcp_directory_scanner.sh"
        description: "Advanced directory scanner with filtering options"
      - path: "bofh/tools/find2tar/tar_parser.js"
        description: "Tool for working with TAR archives"
      - path: "bofh/tools/find2tar/mcp_batch_processor.sh"
        description: "Process files in batches across directories"
    schema_search:
      - path: "bofh/tools/schema_search/find_schemas.sh"
        description: "Find schema patterns in files"
      - path: "bofh/tools/schema_search/search_with_ripgrep.sh"
        description: "Use ripgrep to search for patterns"
  libraries:
    - path: "bofh/lib/filesystem/analysis/analyze_filesystem.py"
      description: "Core filesystem analysis library"
  configuration:
    - path: "bofh/config/mcp/prompt.yaml"
      description: "MCP protocol configuration"
  tests:
    - path: "bofh/tests/run_tests.sh"
      description: "Main test runner script"
    - path: "bofh/tests/unit/filesystem/test_analyze_directory.sh"
      description: "Unit tests for directory analysis"

mcp_command_structure:
  format: |
    [MCP]
    Command: bofh.<module>.<action>
    Parameters:
      <parameter1>: <value1>
      <parameter2>: <value2>
    [/MCP]

basic_command_examples:
  filesystem:
    analyze_directory:
      command: "bofh.filesystem.analyze"
      parameters:
        directory: "/path/to/target"
        output: "/path/to/output"
      actual_script: "bofh/tools/vectorizer/analyze-directory.sh"
    create_archive:
      command: "bofh.filesystem.archive"
      parameters:
        source: "/path/to/source"
        destination: "/path/to/archive.tar"
        compression: "gzip"
      actual_script: "bofh/tools/find2tar/mcp_batch_processor.sh"
  docker:
    visualize_data:
      command: "bofh.docker.visualize"
      parameters:
        inputData: "/path/to/data"
        outputDir: "/path/to/output"
      actual_script: "bofh/tools/vectorizer/docker-compose.yml (service: diskvoyeur-viz)"
    run_analysis:
      command: "bofh.docker.analyze"
      parameters:
        inputDir: "/path/to/input"
        outputDir: "/path/to/output"
        logDir: "/path/to/logs"
      actual_script: "bofh/tools/vectorizer/docker-compose.yml (service: diskvoyeur)"

available_mcp_tools:
    system_tools:
    - name: "execute_command"
      description: "Execute a whitelisted shell command"
    - name: "get_whitelist"
      description: "Retrieve the list of whitelisted commands"
    - name: "add_to_whitelist"
      description: "Add a command to the whitelist"
    - name: "update_security_level"
      description: "Update a command's security level"
    - name: "remove_from_whitelist"
      description: "Remove a command from the whitelist"
    - name: "get_pending_commands"
      description: "List commands pending approval"
    - name: "approve_command"
      description: "Approve a pending command"
    - name: "deny_command"
      description: "Deny a pending command"

command_whitelist:
  description: "For security purposes, the MCP server implements a command whitelist system."
  required_whitelist_entries:
    basic_system_commands:
      - command: "ls"
        description: "List directory contents"
      - command: "pwd"
        description: "Print working directory"
      - command: "echo"
        description: "Print text to standard output"
      - command: "cat"
        description: "Concatenate and print files"
      - command: "cd"
        description: "Change directory"
    file_manipulation_commands:
      - command: "mkdir -p"
        description: "Create directories with parent directories"
      - command: "cp -r"
        description: "Copy directories recursively"
      - command: "touch"
        description: "Create empty files"
      - command: "mv"
        description: "Move files and directories"
      - command: "find"
        description: "Search for files and directories recursively"
        example: "find bofh -type f -not -path '*/\\.*'"
    git_commands:
      - command: "git init"
        description: "Initialize git repository"
      - command: "git add"
        description: "Add files to git staging"
      - command: "git commit"
        description: "Commit changes to git"
      - command: "git push"
        description: "Push changes to remote repository"
      - command: "git pull"
        description: "Pull changes from remote repository"
      - command: "git clone"
        description: "Clone a repository"
      - command: "git checkout"
        description: "Switch branches"
      - command: "git branch"
        description: "List or create branches"
    nodejs_commands:
      - command: "npm install"
        description: "Install Node.js dependencies"
      - command: "npm start"
        description: "Start the application"
      - command: "npm run build"
        description: "Build the application"
      - command: "node"
        description: "Execute Node.js code"
    docker_commands:
      - command: "docker-compose up"
        description: "Start Docker containers"
      - command: "docker-compose down"
        description: "Stop Docker containers"
      - command: "docker build"
        description: "Build Docker images"
      - command: "docker run"
        description: "Run Docker containers"
      - command: "docker ps"
        description: "List running containers"
      - command: "docker rm"
        description: "Remove containers"
      - command: "docker rmi"
        description: "Remove images"
      - command: "docker stop"
        description: "Stop containers"
      - command: "docker network"
        description: "Manage Docker networks"
      - command: "docker volume"
        description: "Manage Docker volumes"
    utility_commands:
      - command: "curl"
        description: "Transfer data with URLs"
      - command: "grep"
        description: "Search for patterns in files"
      - command: "find"
        description: "Search for files"
        example: "find bofh -type f -not -path '*/\\.*' # Find all non-hidden files"
      - command: "tar"
        description: "Create tar archives"
      - command: "gzip"
        description: "Compress files"
      - command: "awk"
        description: "Pattern scanning and processing language"
      - command: "sed"
        description: "Stream editor for filtering/transforming text"
  
  security_levels:
    - level: "safe"
      description: "Commands that are safe to execute without additional review"
    - level: "requires_approval"
      description: "Commands that require review before execution"
    - level: "forbidden"
      description: "Commands that should never be executed"
  
  example_whitelist_addition:
    command: "add_to_whitelist"
    parameters:
      command: "find"
      description: "Search for files and directories recursively"
      securityLevel: "safe"
      example: "find bofh -type f -not -path '*/\\.*'"

execute_command_tool:
  description: "The execute_command tool allows you to run whitelisted shell commands"
  simple_example:
    command: "execute_command"
    parameters:
      command: "ls"
      args: 
        - "-la"
        - "bofh"
  complex_example:
    command: "execute_full_command"
    parameters:
      command: "find bofh -type f -not -path '*/\\.*'"

